name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=app.bpmn --cov-fail-under=80
      - name: Аудит Python-зависимостей
        run: uv run pip-audit --progress-spinner off

  frontend:
    name: frontend (tsc, eslint, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check "src/**/*.{ts,tsx,css}"
      - run: npm test
      - name: Аудит production-зависимостей
        run: npm audit --omit=dev
      - run: npm run build

  migrations:
    name: миграции на пустой PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bpmn
          POSTGRES_PASSWORD: bpmn
          POSTGRES_DB: bpmn_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bpmn -d bpmn_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://bpmn:bpmn@localhost:5432/bpmn_ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Применить миграции на пустой БД
        run: uv run alembic upgrade head
      - name: Откатить и снова применить
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

  images:
    name: образы и compose
    runs-on: ubuntu-latest
    needs: [backend, frontend, migrations]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Проверить docker-compose
        run: docker compose config --quiet
      - name: Собрать образ бэкенда
        run: docker build -t bpmn-studio-backend:ci ./backend
      - name: Собрать образ фронтенда
        run: docker build -t bpmn-studio-frontend:ci ./frontend
