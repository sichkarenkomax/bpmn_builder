[project]
name = "bpmn-studio-backend"
version = "0.2.0"
description = "BPMN Studio — backend (API, валидация, симуляция, экспорт)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "redis>=5.2",
    "lxml>=6.1.3",
    "alembic>=1.20.1",
    "pillow>=13.0.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "svglib>=2.4.0",
    "reportlab>=5.1.0",
    "networkx>=3.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "hypothesis>=6.170.15",
    "aiosqlite>=0.22.1",
    "greenlet>=3.5.6",
    "lxml-stubs>=0.5.1",
    "pip-audit>=2.10.1",
    "pytest-cov>=7.1.0",
    "types-networkx>=3.6.1.20261117",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Depends/Query/Header — не «вызов в дефолте», а объявление зависимости FastAPI.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Body",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
